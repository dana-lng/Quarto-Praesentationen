project:
  type: default

format:
  revealjs:
    theme:
      - default
      - styles/theme.scss
    width: "100%"
    height: "100%"
    margin: 0
    center: false
    navigation-mode: linear
    controls-layout: edges
    controls-tutorial: false
    hash: true
    transition: none
    background-transition: none
    slide-number: true
    logo: logos/htw-logo-small.jpg
    footer: "{{< meta date >}} / {{< meta veranstaltung >}} / {{< meta studiengang >}} / {{< meta professor >}}"
